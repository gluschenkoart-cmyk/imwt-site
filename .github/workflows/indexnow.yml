# Tells Bing (and through IndexNow also Naver, Seznam, Yep and others) that pages changed,
# right after GitHub Pages has published a new version of the site. Bing's index also feeds
# ChatGPT search, Microsoft Copilot and DuckDuckGo. Google does not take part in IndexNow:
# for Google use Search Console (sitemap + "Request indexing").
name: IndexNow

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the new version to be served
        run: sleep 90
      - name: Submit every URL from sitemap.xml
        env:
          HOST: imwt.space
          KEY: a7b5231398f008586cdf753c3ebd14d6
        run: |
          set -euo pipefail
          test "$(curl -fsS "https://$HOST/$KEY.txt")" = "$KEY"
          urls=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | jq -R . | jq -sc .)
          body=$(jq -nc --arg host "$HOST" --arg key "$KEY" \
            --arg loc "https://$HOST/$KEY.txt" --argjson urls "$urls" \
            '{host:$host,key:$key,keyLocation:$loc,urlList:$urls}')
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow HTTP $status"; cat response.txt || true
          case "$status" in 200|202) ;; *) exit 1 ;; esac
